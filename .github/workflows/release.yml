name: Release

# Runs when a pull request is merged (or anything is pushed) to main. If vcvplugin/VERSION names a version
# without a tag yet, tag that commit and publish a GitHub release with the metainfo's notes, the sdist, the wheel
# and a Flatpak bundle.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  version:
    name: Check for an unreleased version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(cat vcvplugin/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  flatpak:
    name: Flatpak bundle
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40  # master
        with:
          manifest-path: build-aux/flatpak/io.github.un1tz3r0.VcvPluginInstaller.yml
          bundle: vcvplugin-installer-${{ needs.version.outputs.version }}.flatpak
          upload-artifact: false
          cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: vcvplugin-installer-${{ needs.version.outputs.version }}.flatpak

  release:
    name: Tag and publish
    needs: [version, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: build-aux/release-notes.py > release-notes.md
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md
